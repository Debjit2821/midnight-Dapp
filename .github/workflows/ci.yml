name: ShadowVote CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Test & Validate Midnight DApp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Compact Smart Contract
        run: npm run build:contract

      - name: Run Test Suite (Contract & Privacy Invariants)
        run: npm test

      - name: Build React / Vite Frontend
        run: npm run build:frontend
